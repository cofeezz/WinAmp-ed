<div class="auth-page">
  <div class="auth-bg">
    <div class="auth-bg__glow auth-bg__glow--1"></div>
    <div class="auth-bg__glow auth-bg__glow--2"></div>
  </div>

  <div class="auth-card glass-card">
    <div class="auth-logo">
      <span class="auth-logo__icon">◈</span>
      <span class="auth-logo__text">underground<em>wiki</em></span>
    </div>

    <h1 class="auth-title">Bem-vindo de volta</h1>
    <p class="auth-subtitle">Entre para continuar arquivando a música independente</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" placeholder="seu@email.com" />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" />
      </div>

      @if (error()) {
        <p class="error-msg">⚠ {{ error() }}</p>
      }

      <button type="submit" class="btn-primary auth-submit" [disabled]="loading()">
        @if (loading()) { Entrando... } @else { Entrar }
      </button>
    </form>

    <p class="auth-footer">
      Não tem conta?
      <a routerLink="/register">Cadastre-se</a>
    </p>
  </div>
</div>
